name: Release

# v1.2.3 形式のタグをプッシュするか、Actions 画面から手動実行 (バージョンを入力) すると、
# 署名済み APK を添付した GitHub Release を作る。手動実行時はタグも自動で作られる。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン (例: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Secrets に RSSR_KEYSTORE_BASE64 などがあればその鍵で署名する (無ければデバッグ鍵)
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RSSR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RSSR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::RSSR_KEYSTORE_BASE64 が未設定のためデバッグ鍵で署名します"
          fi

      - name: Unit tests (core)
        run: ./gradlew :core:test --console=plain

      - name: Build release APK
        env:
          RSSR_KEYSTORE_PASSWORD: ${{ secrets.RSSR_KEYSTORE_PASSWORD }}
          RSSR_KEY_ALIAS: ${{ secrets.RSSR_KEY_ALIAS }}
          RSSR_KEY_PASSWORD: ${{ secrets.RSSR_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -PversionName="${TAG#v}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "rssr-${TAG}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: rssr-${{ env.TAG }}.apk
          generate_release_notes: true
